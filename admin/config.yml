backend:
  name: github
  repo: ignitrondev/org
  branch: astro-clean

media_folder: "public/images"
public_folder: "/org/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Publish Date", name: "date", widget: "datetime"}
      - {label: "Excerpt", name: "excerpt", widget: "text"}
      - {label: "Category", name: "category", widget: "select", options: ["story", "personal", "technology", "innovation", "company"]}
      - {label: "Badge Label", name: "label", widget: "string"}
      - {label: "Color (CSS Var)", name: "color", widget: "string", default: "var(--cyber-cyan)"}
      - {label: "Featured", name: "featured", widget: "boolean", default: false, required: false}
      - {label: "Body", name: "body", widget: "markdown"}
