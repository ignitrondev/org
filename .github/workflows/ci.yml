name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile fails the run if bun.lock is out of step with
      # package.json, so a forgotten `bun install` cannot reach main.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `astro check` validates .astro templates and TypeScript, which the
      # build alone does not do. The three.js type graph pushes it past the
      # default 2 GB heap, hence the raised limit.
      - name: Type-check
        run: bunx astro check
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Build
        run: bun run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
